<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🍺 Пивная рулетка</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes shake { 0%,100%{transform:translate(0,0)} 10%{transform:translate(-8px,-4px)} 30%{transform:translate(8px,4px)} 50%{transform:translate(-6px,4px)} 70%{transform:translate(6px,-4px)} 90%{transform:translate(-3px,2px)} }
.animate-shake { animation: shake 0.6s; }
@keyframes particle-fly { 0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(0);opacity:0} }
.particle { animation: particle-fly 2s ease-out forwards; }
@keyframes flash-anim { 0%{opacity:0} 50%{opacity:0.6} 100%{opacity:0} }
.flash { animation: flash-anim 0.2s; }
body { font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

function BeerMug() {
  return (<svg viewBox="0 0 100 100" className="w-full h-full">
    <defs>
      <linearGradient id="beerGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0%" stopColor="#fde68a" /><stop offset="50%" stopColor="#f59e0b" /><stop offset="100%" stopColor="#b45309" />
      </linearGradient>
    </defs>
    <rect x="22" y="22" width="48" height="60" rx="3" fill="url(#beerGrad)" stroke="#78350f" strokeWidth="1.5" />
    <ellipse cx="46" cy="22" rx="24" ry="8" fill="#fffbeb" stroke="#78350f" strokeWidth="1.5" />
    <circle cx="35" cy="18" r="5" fill="#fffbeb" />
    <circle cx="50" cy="15" r="6" fill="#fffbeb" />
    <circle cx="60" cy="19" r="4" fill="#fffbeb" />
    <path d="M 70 35 Q 88 38 88 55 Q 88 72 70 72" fill="none" stroke="#78350f" strokeWidth="4" />
    <circle cx="38" cy="50" r="2" fill="#fffbeb" opacity="0.8" />
    <circle cx="52" cy="62" r="1.5" fill="#fffbeb" opacity="0.8" />
    <circle cx="46" cy="70" r="2" fill="#fffbeb" opacity="0.8" />
  </svg>);
}

function BrokenMug() {
  return (<svg viewBox="0 0 100 100" className="w-full h-full">
    <ellipse cx="50" cy="80" rx="40" ry="10" fill="#b45309" opacity="0.7" />
    <ellipse cx="50" cy="78" rx="35" ry="7" fill="#fde68a" opacity="0.5" />
    <path d="M 18 30 L 28 22 L 32 50 L 22 70 L 12 60 Z" fill="#fbbf24" stroke="#78350f" strokeWidth="1.5" transform="rotate(-25 22 50)" />
    <path d="M 60 25 L 78 28 L 80 55 L 68 65 L 62 45 Z" fill="#fbbf24" stroke="#78350f" strokeWidth="1.5" transform="rotate(20 70 45)" />
    <path d="M 40 8 L 55 5 L 60 18 L 50 22 L 38 18 Z" fill="#fffbeb" stroke="#78350f" strokeWidth="1.5" />
    <circle cx="20" cy="55" r="2" fill="#f59e0b" />
    <circle cx="80" cy="60" r="2.5" fill="#f59e0b" />
  </svg>);
}

function Revolver({ rotation, spinning }) {
  return (<div className="relative"><svg viewBox="0 0 300 180" className="w-72 h-44 drop-shadow-2xl">
    <defs>
      <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#9ca3af" /><stop offset="100%" stopColor="#1f2937" /></linearGradient>
      <linearGradient id="metalDark" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#6b7280" /><stop offset="100%" stopColor="#111827" /></linearGradient>
      <linearGradient id="grip" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="#78350f" /><stop offset="100%" stopColor="#451a03" /></linearGradient>
      <radialGradient id="chamber" cx="0.5" cy="0.5"><stop offset="0%" stopColor="#1f2937" /><stop offset="100%" stopColor="#000" /></radialGradient>
    </defs>
    <rect x="155" y="62" width="120" height="20" rx="3" fill="url(#metal)" />
    <circle cx="272" cy="72" r="6" fill="#000" />
    <g style={{ transformOrigin: '100px 90px', transform: 'rotate(' + rotation + 'deg)', transition: spinning ? 'transform 0.8s cubic-bezier(0.2, 0.8, 0.4, 1)' : 'none' }}>
      <circle cx="100" cy="90" r="42" fill="url(#metalDark)" stroke="#1f2937" strokeWidth="2" />
      {[0,1,2,3,4,5].map(i => {
        const angle = (i/6)*Math.PI*2 - Math.PI/2;
        const cx = 100 + Math.cos(angle)*25;
        const cy = 90 + Math.sin(angle)*25;
        return (<g key={i}><circle cx={cx} cy={cy} r="8" fill="url(#chamber)" stroke="#374151" strokeWidth="1" /><circle cx={cx} cy={cy} r="4" fill="#000" /></g>);
      })}
      <circle cx="100" cy="90" r="6" fill="#374151" />
    </g>
    <path d="M 142 75 L 155 70 L 155 85 L 142 80 Z" fill="url(#metal)" />
    <path d="M 90 130 Q 90 155 115 155 Q 130 155 130 130" fill="none" stroke="url(#metalDark)" strokeWidth="6" strokeLinecap="round" />
    <path d="M 60 90 Q 50 100 50 130 Q 50 165 75 170 L 95 165 Q 100 140 100 130 L 100 105 Z" fill="url(#grip)" stroke="#1c1917" strokeWidth="1.5" />
  </svg></div>);
}

function App() {
  const [chambers, setChambers] = useState(() => initGame());
  const [revealed, setRevealed] = useState([]);
  const [gameOver, setGameOver] = useState(false);
  const [currentPlayer, setCurrentPlayer] = useState(1);
  const [mode, setMode] = useState('solo');
  const [scores, setScores] = useState({ p1: 0, p2: 0 });
  const [message, setMessage] = useState('Крути барабан и выбирай кружку...');
  const [spinning, setSpinning] = useState(false);
  const [particles, setParticles] = useState([]);
  const [drumRotation, setDrumRotation] = useState(0);
  const [flash, setFlash] = useState(false);
  const [shake, setShake] = useState(false);

  function initGame() {
    const arr = [false,false,false,false,false,false];
    arr[Math.floor(Math.random()*6)] = true;
    return arr;
  }

  function reset(keepScores = true) {
    setChambers(initGame());
    setRevealed([]);
    setGameOver(false);
    setCurrentPlayer(1);
    setMessage(mode === 'solo' ? 'Крути барабан и выбирай кружку...' : 'Игрок 1, твой ход');
    setParticles([]);
    setSpinning(false);
    if (!keepScores) setScores({ p1: 0, p2: 0 });
  }

  function spawnParticles(x, y) {
    const emojis = ['🍺','💧','🫧','✨','💦','🍻'];
    const list = [];
    for (let i = 0; i < 35; i++) {
      const angle = (Math.PI*2*i)/35 + Math.random()*0.5;
      const speed = 80 + Math.random()*200;
      list.push({ id: i, x, y, dx: Math.cos(angle)*speed, dy: Math.sin(angle)*speed - 80, emoji: emojis[Math.floor(Math.random()*emojis.length)], rotation: Math.random()*720 - 360, scale: 0.5 + Math.random()*1.3 });
    }
    setParticles(list);
    setTimeout(() => setParticles([]), 2500);
  }

  function pick(idx) {
    if (gameOver || revealed.includes(idx) || spinning) return;
    setSpinning(true);
    setDrumRotation(r => r + 1080 + Math.random()*360);
    setTimeout(() => {
      setSpinning(false);
      const newRevealed = [...revealed, idx];
      setRevealed(newRevealed);
      if (chambers[idx]) {
        setFlash(true);
        setShake(true);
        setTimeout(() => setFlash(false), 200);
        setTimeout(() => setShake(false), 600);
        const cell = document.getElementById('cell-' + idx);
        if (cell) {
          const rect = cell.getBoundingClientRect();
          spawnParticles(rect.left + rect.width/2, rect.top + rect.height/2);
        }
        setGameOver(true);
        if (mode === 'solo') {
          setMessage('💥 Крах! Кружка ' + (idx+1) + ' разбилась. Ты пьёшь штрафную!');
        } else {
          const loser = currentPlayer;
          const winner = currentPlayer === 1 ? 2 : 1;
          setMessage('💥 Игрок ' + loser + ' разбил кружку! Победил Игрок ' + winner + ' 🍻');
          setScores(s => ({ ...s, [winner === 1 ? 'p1' : 'p2']: s[winner === 1 ? 'p1' : 'p2'] + 1 }));
        }
      } else {
        const remaining = 6 - newRevealed.length;
        if (mode === 'solo') {
          if (remaining === 1) { setMessage('🎉 Невероятно! Все кружки целы!'); setGameOver(true); }
          else { setMessage('🍺 Кружка цела! Осталось ' + remaining + '.'); }
        } else {
          const next = currentPlayer === 1 ? 2 : 1;
          setCurrentPlayer(next);
          setMessage('🍺 Кружка цела! Игрок ' + next + ', твой ход');
        }
      }
    }, 800);
  }

  return (<div className={'min-h-screen bg-gradient-to-br from-amber-950 via-stone-900 to-amber-950 flex items-center justify-center p-6 overflow-hidden relative ' + (shake ? 'animate-shake' : '')}>
    {flash && <div className="fixed inset-0 bg-amber-300 pointer-events-none flash z-50" />}
    <div className="fixed inset-0 pointer-events-none z-40">
      {particles.map(p => (<div key={p.id} className="absolute particle text-3xl" style={{ left: p.x, top: p.y, '--tx': p.dx + 'px', '--ty': p.dy + 'px', '--rot': p.rotation + 'deg', transform: 'scale(' + p.scale + ')' }}>{p.emoji}</div>))}
    </div>
    <div className="max-w-2xl w-full relative z-10">
      <div className="text-center mb-6">
        <h1 className="text-5xl font-black text-amber-100 mb-2 tracking-tight" style={{ textShadow: '0 0 30px rgba(251,191,36,0.5)' }}>🍺 ПИВНАЯ РУЛЕТКА</h1>
        <p className="text-amber-200 opacity-60 text-sm">5 целых кружек · 1 ловушка</p>
      </div>
      <div className="flex justify-center mb-6"><Revolver rotation={drumRotation} spinning={spinning} /></div>
      <div className="flex gap-2 mb-5 justify-center">
        <button onClick={() => { setMode('solo'); reset(false); }} className={'flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition-all ' + (mode === 'solo' ? 'bg-amber-400 text-stone-900 shadow-lg' : 'bg-stone-800 text-amber-200 hover:bg-stone-700')}>👤 СОЛО</button>
        <button onClick={() => { setMode('duel'); reset(false); }} className={'flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition-all ' + (mode === 'duel' ? 'bg-orange-500 text-white shadow-lg' : 'bg-stone-800 text-amber-200 hover:bg-stone-700')}>👥 ДУЭЛЬ</button>
      </div>
      <div className="bg-stone-800 bg-opacity-80 backdrop-blur border border-amber-700 rounded-2xl p-5 mb-6 text-center shadow-xl">
        {mode === 'duel' && !gameOver && (<div className="text-xs uppercase tracking-widest text-amber-200 opacity-50 mb-2">Ход: <span className={currentPlayer === 1 ? 'text-amber-300' : 'text-orange-400'}>Игрок {currentPlayer}</span></div>)}
        <div className="text-lg text-amber-50 font-medium" style={{minHeight:'28px'}}>{message}</div>
        {mode === 'duel' && (<div className="flex justify-center gap-6 mt-3 text-sm font-bold"><div className="text-amber-300">Игрок 1: {scores.p1}</div><div className="text-orange-400">Игрок 2: {scores.p2}</div></div>)}
      </div>
      <div className="grid grid-cols-3 gap-4 mb-6">
        {chambers.map((isLose, idx) => {
          const isRevealed = revealed.includes(idx);
          const showResult = isRevealed || gameOver;
          return (<button id={'cell-' + idx} key={idx} onClick={() => pick(idx)} disabled={isRevealed || gameOver || spinning}
            className={'aspect-square rounded-2xl transition-all duration-300 relative overflow-hidden p-2 ' + (!showResult ? 'bg-gradient-to-br from-stone-700 to-stone-900 hover:from-stone-600 hover:to-stone-800 cursor-pointer hover:scale-105 hover:shadow-2xl border-2 border-amber-700' : isLose ? 'bg-gradient-to-br from-red-700 via-amber-800 to-stone-900 border-2 border-red-500 shadow-2xl' : 'bg-gradient-to-br from-amber-500 to-amber-700 border-2 border-amber-300 shadow-lg') + (spinning ? ' animate-pulse' : '')}>
            {!showResult ? (<div className="flex items-center justify-center h-full"><span className="text-3xl text-amber-200 opacity-40 font-mono font-bold">{idx + 1}</span></div>) : isLose ? <BrokenMug /> : <BeerMug />}
          </button>);
        })}
      </div>
      <div className="flex gap-3 justify-center flex-wrap">
        <button onClick={() => reset(true)} className="px-6 py-3 bg-gradient-to-r from-amber-400 to-orange-500 text-stone-900 rounded-lg font-bold hover:scale-105 transition-transform shadow-lg">🔄 ЕЩЁ ПО ОДНОЙ</button>
        {mode === 'duel' && (<button onClick={() => reset(false)} className="px-6 py-3 bg-stone-800 text-amber-200 rounded-lg font-bold hover:bg-stone-700 transition-colors">СБРОС СЧЁТА</button>)}
      </div>
      <div className="text-center mt-6 text-xs text-amber-200 opacity-30">🍻 Пейте ответственно. Это просто игра.</div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
