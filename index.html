/* ═══════════════ AUDIO ═══════════════ */
function playGunshot() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const buf = ctx.createBuffer(1,ctx.sampleRate*0.6,ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++){const t=i/ctx.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*18)*(1+3*Math.exp(-t*60));}
    const src=ctx.createBufferSource(); src.buffer=buf;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800;
    const g=ctx.createGain(); g.gain.value=2.5;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
  } catch(e){}
}
function playTick(freq=800) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(0.4,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.06);
    o.start(ctx.currentTime); o.stop(ctx.currentTime+0.07);
  } catch(e){}
}
function playExplosion() {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const buf=ctx.createBuffer(1,ctx.sampleRate*1,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){const t=i/ctx.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t*6)*(1+2*Math.exp(-t*20));}
    const src=ctx.createBufferSource(); src.buffer=buf;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=400;
    const g=ctx.createGain(); g.gain.value=3;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
  } catch(e){}
}

/* ═══════════════ 1. ПИВНАЯ РУЛЕТКА ═══════════════ */
function RouletteGame({onBack}){
  const[revolverIdx,setRevolverIdx]=useState(0);
  const[chambers,setChambers]=useState(()=>initGame(1));
  const[revealed,setRevealed]=useState([]);
  const[gameOver,setGameOver]=useState(false);
  const[currentPlayer,setCurrentPlayer]=useState(1);
  const[mode,setMode]=useState('solo');
  const[scores,setScores]=useState({p1:0,p2:0});
  const[message,setMessage]=useState('Выбери ствол и крути барабан...');
  const[spinning,setSpinning]=useState(false);
  const[particles,setParticles]=useState([]);
  const[drumRotation,setDrumRotation]=useState(0);
  const[flash,setFlash]=useState(false);
  const[shake,setShake]=useState(false);
  const[muzzle,setMuzzle]=useState(false);

  function initGame(b){
    const arr=[false,false,false,false,false,false];
    const pos=[];
    while(pos.length<b){const p=Math.floor(Math.random()*6);if(!pos.includes(p))pos.push(p);}
    pos.forEach(p=>arr[p]=true);
    return arr;
  }
  function reset(keepScores=true,b){
    const bullets=b!==undefined?b:REVOLVERS[revolverIdx].bullets;
    setChambers(initGame(bullets));setRevealed([]);setGameOver(false);setCurrentPlayer(1);
    setMessage(mode==='solo'?'Крути барабан и выбирай кружку...':'Игрок 1, твой ход');
    setParticles([]);setSpinning(false);setMuzzle(false);
    if(!keepScores)setScores({p1:0,p2:0});
  }
  function pickRevolver(i){
    setRevolverIdx(i);const b=REVOLVERS[i].bullets;
    setChambers(initGame(b));setRevealed([]);setGameOver(false);setCurrentPlayer(1);
    setMessage('Крути барабан и выбирай кружку...');setParticles([]);setSpinning(false);setMuzzle(false);setScores({p1:0,p2:0});
  }
  function spawnParticles(x,y){
    const emojis=['🍺','💧','🫧','✨','💦','🍻'];
    const list=[];
    for(let i=0;i<30;i++){const angle=(Math.PI*2*i)/30+Math.random()*0.5,speed=80+Math.random()*200;list.push({id:i,x,y,dx:Math.cos(angle)*speed,dy:Math.sin(angle)*speed-80,emoji:emojis[Math.floor(Math.random()*emojis.length)],rotation:Math.random()*720-360,scale:0.5+Math.random()*1.3});}
    setParticles(list);setTimeout(()=>setParticles([]),2500);
  }
  function pick(idx){
    if(gameOver||revealed.includes(idx)||spinning)return;
    setSpinning(true);setDrumRotation(r=>r+1080+Math.random()*360);
    setTimeout(()=>{
      setSpinning(false);const nr=[...revealed,idx];setRevealed(nr);
      if(chambers[idx]){
        playGunshot();setMuzzle(true);setTimeout(()=>setMuzzle(false),200);
        setFlash(true);setTimeout(()=>setFlash(false),200);
        setShake(true);setTimeout(()=>setShake(false),600);
        const cell=document.getElementById('cell-'+idx);
        if(cell){const r=cell.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}
        setGameOver(true);
        if(mode==='solo'){setMessage('💥 Крах! Кружка '+(idx+1)+' разбилась. Пьёшь штрафную!');}
        else{const loser=currentPlayer,winner=currentPlayer===1?2:1;setMessage('💥 Игрок '+loser+' разбил кружку! Победил Игрок '+winner+' 🍻');setScores(s=>({...s,[winner===1?'p1':'p2']:s[winner===1?'p1':'p2']+1}));}
      } else {
        const rem=6-nr.length;
        if(mode==='solo'){if(rem===0){setMessage('🎉 Невероятно! Все кружки целы!');setGameOver(true);}else{setMessage('🍺 Цела! Осталось '+rem+'.');}}
        else{const next=currentPlayer===1?2:1;setCurrentPlayer(next);setMessage('🍺 Цела! Игрок '+next+', твой ход');}
      }
    },800);
  }
  const rev=REVOLVERS[revolverIdx],RC=rev.render;
  return(
    <div className={'min-h-screen bg-gradient-to-br from-amber-950 via-stone-900 to-amber-950 flex items-start justify-center py-4 px-3 overflow-x-hidden relative '+(shake?'shake':'')}>
      {flash&&<div className="fixed inset-0 bg-amber-300 pointer-events-none flash z-50"/>}
      <div className="fixed inset-0 pointer-events-none z-40">{particles.map(p=>(<div key={p.id} className="absolute pfly text-2xl" style={{left:p.x,top:p.y,'--tx':p.dx+'px','--ty':p.dy+'px','--rot':p.rotation+'deg',transform:'scale('+p.scale+')'}}>{p.emoji}</div>))}</div>
      <div className="max-w-lg w-full relative z-10">
        <BackBtn onBack={onBack}/>
        <div className="text-center mb-2">

/* ═══════════════ 2. БОМБА ═══════════════ */
function BombaGame({onBack}){
  const[phase,setPhase]=useState('idle'); // idle | ticking | exploded
  const[timeLeft,setTimeLeft]=useState(0);
  const[totalTime,setTotalTime]=useState(0);
  const intervalRef=useRef(null);
  const tickRef=useRef(null);

  function startBomb(){
    const t=10+Math.floor(Math.random()*36); // 10-45 seconds
    setTotalTime(t);setTimeLeft(t);setPhase('ticking');
  }

  useEffect(()=>{
    if(phase!=='ticking')return;
    intervalRef.current=setInterval(()=>{
      setTimeLeft(prev=>{
        if(prev<=1){
          clearInterval(intervalRef.current);
          clearInterval(tickRef.current);
          playExplosion();
          setPhase('exploded');
          return 0;
        }
        return prev-1;
      });
    },1000);
    // ticking sound — speeds up as time runs out
    function scheduleTick(){
      setTimeLeft(cur=>{
        const ratio=cur/totalTime;
        const delay=ratio>0.5?600:ratio>0.25?350:180;
        playTick(600+Math.random()*200);
        tickRef.current=setTimeout(scheduleTick,delay);
        return cur;
      });
    }
    setTimeout(scheduleTick,200);
    return()=>{clearInterval(intervalRef.current);clearTimeout(tickRef.current);};
  },[phase]);

  function reset(){setPhase('idle');setTimeLeft(0);clearInterval(intervalRef.current);clearTimeout(tickRef.current);}

  const progress=totalTime>0?(timeLeft/totalTime)*100:100;
  const danger=timeLeft<=10;

  if(phase==='exploded') return(
    <div className="min-h-screen bg-red-900 flex flex-col items-center justify-center p-6 text-center">
      <div className="text-9xl mb-4 boom">💥</div>
      <h2 className="text-5xl font-black text-white mb-3">БУМ!</h2>
      <p className="text-2xl text-red-200 font-bold mb-8">ТЫ ПЬЁШЬ! 🍺</p>
      <button onClick={reset} className="px-8 py-4 bg-white text-red-900 rounded-2xl font-black text-xl active:scale-95">Заново</button>
      <button onClick={onBack} className="mt-4 text-red-300 text-sm">← Меню</button>
    </div>
  );

  if(phase==='ticking'){
    const blinkSpeed=Math.max(0.12,timeLeft*0.055)+'s';
    return(
    <div className={`min-h-screen flex flex-col items-center justify-center p-6 text-center transition-colors duration-500 ${danger?'bg-red-950':'bg-stone-950'} relative overflow-hidden`}>
      {danger&&<div className="fixed inset-0 bg-red-500 pointer-events-none redflash z-10" style={{'--blink-speed':blinkSpeed}}/>}
      <div className={`text-8xl mb-6 relative z-20 ${danger?'animate-bounce':''}`} style={{filter:danger?'drop-shadow(0 0 30px red)':'none'}}>🧨</div>
      {!danger&&<div className="text-8xl font-black mb-4 tabular-nums text-white">{timeLeft}</div>}
      {danger&&<div className="text-8xl font-black mb-4">❓</div>}
      {/* progress bar */}
      <div className="w-64 h-3 bg-stone-800 rounded-full mb-8 overflow-hidden relative z-20">
        <div className={`h-full rounded-full transition-all duration-1000 ${danger?'bg-red-500':'bg-amber-400'}`} style={{width:progress+'%'}}/>
      </div>
      <button onClick={()=>{}}
        className={`w-64 py-6 rounded-3xl font-black text-3xl active:scale-95 shadow-2xl transition-colors relative z-20 ${danger?'bg-red-500 text-white':'bg-amber-400 text-stone-900'}`}>
        📲 ПЕРЕДАЙ!
      </button>
      <p className="text-stone-500 text-xs mt-6 relative z-20">Нажимай «передай» каждый раз когда берёшь телефон</p>
    </div>
  );};

  return(
    <div className="min-h-screen bg-gradient-to-br from-red-950 via-stone-900 to-red-950 flex flex-col items-center justify-center p-6 text-center">
      <BackBtn onBack={onBack} light/>
      <div className="text-8xl mb-6" style={{filter:'drop-shadow(0 0 20px rgba(255,100,0,0.5))'}}>🧨</div>
      <h1 className="text-4xl font-black text-white mb-2">БОМБА</h1>
      <p className="text-red-200 opacity-70 mb-8 text-sm">Таймер скрыт. Передавай телефон по кругу.<br/>У кого взорвётся — пьёт.</p>
      <button onClick={startBomb} className="w-56 py-6 bg-red-500 text-white rounded-3xl font-black text-2xl active:scale-95 shadow-2xl">
        💣 ПОДЖЕЧЬ!
      </button>
    </div>
  );
}

/* ═══════════════ 3. РУЛЕТКА ИМЁН ═══════════════ */
const WHEEL_COLORS=['#f59e0b','#ef4444','#3b82f6','#10b981','#8b5cf6','#f97316','#ec4899','#06b6d4','#84cc16','#a855f7'];

function NamesGame({onBack}){
  const[phase,setPhase]=useState('setup');
  const[players,setPlayers]=useState([]);
  const[rotation,setRotation]=useState(0);
  const[spinning,setSpinning]=useState(false);
  const[winner,setWinner]=useState(null);
  const[gulps,setGulps]=useState(null);

  function togglePlayer(id){
    if(players.find(p=>p.charId===id)){setPlayers(players.filter(p=>p.charId!==id));}
    else if(players.length<8){setPlayers([...players,{charId:id,name:CHAR_NAMES[id-1]}]);}
  }
  function renamePlayer(id,name){setPlayers(players.map(p=>p.charId===id?{...p,name}:p));}

  function spin(){
    if(spinning||players.length<2)return;
    setWinner(null);setGulps(null);setSpinning(true);
    const wi=Math.floor(Math.random()*players.length);
    const seg=360/players.length;
    const targetR=rotation+(5+Math.floor(Math.random()*5))*360+(wi+0.5)*seg;
    setRotation(targetR);
    setTimeout(()=>{setSpinning(false);setWinner(players[wi]);},4000);
  }

  const cx=150,cy=150,r=128,n=players.length||1;

  if(phase==='spin') return(
    <div className="min-h-screen bg-gradient-to-br from-purple-950 via-stone-900 to-purple-950 flex flex-col items-center p-4">
      <BackBtn onBack={()=>{setPhase('setup');setWinner(null);setGulps(null);}} light/>
      <h1 className="text-3xl font-black text-purple-100 mb-3">🎰 Рулетка имён</h1>
      <div className="relative mb-4">
        <svg viewBox="0 0 300 300" className="w-72 h-72">
          <polygon points="150,26 141,4 159,4" fill="#fbbf24" stroke="#92400e" strokeWidth="1.5"/>
          <g style={{transformOrigin:'150px 150px',transform:`rotate(${rotation}deg)`,transition:spinning?'transform 4s cubic-bezier(0.17,0.67,0.1,1)':'none'}}>
            {players.map((pl,i)=>{
              const seg=360/n,startD=i*seg,endD=(i+1)*seg;
              const sR=(startD-90)*Math.PI/180,eR=(endD-90)*Math.PI/180;
              const x1=cx+r*Math.cos(sR),y1=cy+r*Math.sin(sR),x2=cx+r*Math.cos(eR),y2=cy+r*Math.sin(eR);
              const path=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${seg>180?1:0} 1 ${x2} ${y2} Z`;
              const midD=(startD+endD)/2,midR=(midD-90)*Math.PI/180;
              const lx=cx+r*0.65*Math.cos(midR),ly=cy+r*0.65*Math.sin(midR);
              const nm=pl.name.length>8?pl.name.slice(0,7)+'…':pl.name;
              return(<g key={i}><path d={path} fill={WHEEL_COLORS[i%WHEEL_COLORS.length]} stroke="#fff" strokeWidth="2"/><text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fill="#fff" fontSize={pl.name.length>6?'9':'11'} fontWeight="bold" transform={`rotate(${midD},${lx},${ly})`}>{nm}</text></g>);
            })}
            <circle cx={cx} cy={cy} r="18" fill="#1f2937" stroke="#fff" strokeWidth="2"/>
          </g>
        </svg>
      </div>
      {!winner&&<button onClick={spin} disabled={spinning} className="px-8 py-4 bg-purple-600 text-white rounded-2xl font-black text-2xl active:scale-95 disabled:opacity-50 shadow-lg">{spinning?'...':'КРУТИТЬ!'}</button>}
      {winner&&(
        <div className="text-center pop">
          <img src={`chars/char${winner.charId}.jpg`} className="w-24 h-32 object-cover rounded-2xl mx-auto mb-2 border-4 border-yellow-400 shadow-xl" style={{objectPosition:'top'}}/>
          <div className="text-4xl font-black text-yellow-300 mb-1">{winner.name}</div>
          <div className="text-2xl text-white mb-4">пьёт! 🍺</div>
          {gulps?<div className="text-4xl font-black text-amber-300 mb-4">{gulps} {gulps===1?'глоток':gulps<5?'глотка':'глотков'}!</div>:
            <button onClick={()=>setGulps(1+Math.floor(Math.random()*5))} className="px-6 py-3 bg-amber-500 text-stone-900 rounded-xl font-bold text-lg active:scale-95 mb-3">🎲 Сколько глотков?</button>}
          <div><button onClick={()=>{setWinner(null);setGulps(null);}} className="px-6 py-2 bg-stone-700 text-white rounded-xl text-sm active:scale-95">Крутить снова</button></div>
        </div>
      )}
    </div>
  );

  return(
    <div className="min-h-screen bg-gradient-to-br from-purple-950 via-stone-900 to-purple-950 flex flex-col p-4">
      <BackBtn onBack={onBack} light/>
      <h1 className="text-2xl font-black text-purple-100 text-center mb-1">🎰 Рулетка имён</h1>
      <p className="text-purple-300 text-xs text-center mb-3 opacity-70">Выбери игроков (мин. 2) · тапни чтобы переименовать</p>
      <AvatarPicker players={players} onToggle={togglePlayer} onRename={renamePlayer} borderColor="border-purple-400"/>
      <button onClick={()=>setPhase('spin')} disabled={players.length<2}
        className="w-full py-4 bg-purple-600 text-white rounded-2xl font-black text-xl active:scale-95 disabled:opacity-40 shadow-lg mt-4">
        ИГРАТЬ ({players.length} чел.)
      </button>
    </div>
  );
}

  "Кто из нас чаще всего опаздывает?",
  "Кто из нас съел больше всех сегодня?",

  "Кто из нас хуже всего танцует?",
  "Кто из нас самый ленивый?",
  "Кто из нас чаще сидит в телефоне?",
  "Кто из нас первым бы сбежал домой?",
  "Кто из нас самый хитрый?",
  "Кто из нас дольше всех спит?",
  "Кто из нас тратит больше всех денег?",
  "Кто из нас самый весёлый сегодня?",

  "Кто из нас не помнит вчерашний вечер?",
  "Кто из нас чаще всего врёт?",
  "Кто из нас больше всех флиртует?",
  "Кто из нас самый трусливый?",

];

function KtoIzNasGame({onBack}){
  const[phase,setPhase]=useState('setup'); // setup | pass | vote | result
  const[players,setPlayers]=useState([]);
  const[qIdx,setQIdx]=useState(0);
  const[questions,setQuestions]=useState(()=>[...QUESTIONS].sort(()=>Math.random()-0.5));
  const[voterIdx,setVoterIdx]=useState(0);
  const[votes,setVotes]=useState({});

  function togglePlayer(id){
    if(players.find(p=>p.charId===id)){setPlayers(players.filter(p=>p.charId!==id));}
    else if(players.length<8){setPlayers([...players,{charId:id,name:CHAR_NAMES[id-1]}]);}
  }
  function renamePlayer(id,name){setPlayers(players.map(p=>p.charId===id?{...p,name}:p));}

  function startGame(){
    setVoterIdx(0);setVotes({});setQIdx(0);
    setQuestions([...QUESTIONS].sort(()=>Math.random()-0.5));
    setPhase('pass');
  }

  function vote(key){
    const nv={...votes,[key]:(votes[key]||0)+1};
    setVotes(nv);
    if(voterIdx+1>=players.length){setPhase('result');}
    else{setVoterIdx(v=>v+1);setPhase('pass');}
  }

  function nextQuestion(){
    setVoterIdx(0);setVotes({});
    setQIdx(i=>(i+1)%questions.length);
    setPhase('pass');
  }

  const curVoter=players[voterIdx];
  const winnerEntry=phase==='result'?Object.entries(votes).sort((a,b)=>b[1]-a[1])[0]:null;
  const winnerPlayer=winnerEntry?players.find(p=>p.name===winnerEntry[0]):null;
  const tie=winnerEntry&&Object.values(votes).filter(v=>v===winnerEntry[1]).length>1;
  const cols=players.length<=4?'grid-cols-2':'grid-cols-4';

  if(phase==='setup') return(
    <div className="min-h-screen bg-gradient-to-br from-indigo-950 via-blue-950 to-indigo-950 flex flex-col p-4">
      <BackBtn onBack={onBack} light/>
      <h1 className="text-2xl font-black text-blue-100 text-center mb-1">🤔 Кто из нас?</h1>
      <p className="text-blue-300 text-xs text-center mb-3 opacity-70">Выбери игроков (мин. 2) · тапни чтобы переименовать</p>
      <AvatarPicker players={players} onToggle={togglePlayer} onRename={renamePlayer} borderColor="border-blue-400"/>
      <button onClick={startGame} disabled={players.length<2}
        className="w-full py-4 bg-blue-600 text-white rounded-2xl font-black text-xl active:scale-95 disabled:opacity-40 shadow-lg mt-4">
        ИГРАТЬ ({players.length} чел.)
      </button>
    </div>
  );

  // Передача телефона — как в КНБ
  if(phase==='pass'&&curVoter) return(
    <div className="min-h-screen bg-stone-950 flex flex-col items-center justify-center p-6 text-center">
      <div className="text-6xl mb-5">📲</div>
      <p className="text-stone-400 text-lg mb-4">Передай телефон</p>
      <div className="relative mb-3">
        <img src={`chars/char${curVoter.charId}.jpg`} className="w-28 h-36 object-cover rounded-2xl mx-auto border-4 border-blue-500 shadow-2xl" style={{objectPosition:'top'}}/>
        <div className="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs font-black px-3 py-1 rounded-full whitespace-nowrap">{voterIdx+1} / {players.length}</div>
      </div>
      <p className="text-white text-3xl font-black mt-4 mb-1">{curVoter.name}</p>
      <p className="text-blue-400 text-sm mb-10 opacity-70">голосует тайно</p>
      <button onClick={()=>setPhase('vote')}
        className="w-64 py-5 bg-blue-600 text-white rounded-2xl font-black text-xl active:scale-95 shadow-xl">
        Я готов →
      </button>
    </div>
  );

  // Экран голосования
  if(phase==='vote'&&curVoter) return(
    <div className="min-h-screen bg-gradient-to-br from-indigo-950 via-blue-950 to-indigo-950 flex flex-col p-4">
      <div className="flex items-center justify-between mb-3">
        <button onClick={()=>setPhase('setup')} className="text-blue-400 text-sm active:opacity-50">← Стоп</button>
        <div className="flex items-center gap-2">
          <img src={`chars/char${curVoter.charId}.jpg`} className="w-7 h-9 object-cover rounded-lg border border-blue-400" style={{objectPosition:'top'}}/>
          <span className="text-blue-300 text-xs font-bold">{curVoter.name}</span>
        </div>
      </div>
      {/* Вопрос */}
      <div className="rounded-3xl p-5 mb-4 text-center" style={{background:'linear-gradient(135deg,rgba(37,99,235,0.35),rgba(99,102,241,0.25))',border:'1px solid rgba(99,102,241,0.4)',backdropFilter:'blur(8px)'}}>
        <p className="text-blue-300 text-xs uppercase tracking-widest mb-2 opacity-70">Вопрос {qIdx+1}</p>
        <p className="text-white text-lg font-black leading-snug">{questions[qIdx]}</p>
      </div>
      {/* Сетка игроков */}
      <div className={`grid ${cols} gap-3 flex-1`}>
        {players.map((pl,i)=>(
          <button key={i} onClick={()=>vote(pl.name)}
            className="flex flex-col items-center py-4 px-2 rounded-3xl active:scale-95 transition-all relative overflow-hidden"
            style={{background:'linear-gradient(160deg,rgba(30,58,138,0.8),rgba(49,46,129,0.6))',border:'1.5px solid rgba(99,102,241,0.5)'}}>
            <img src={`chars/char${pl.charId}.jpg`} className="w-16 object-cover rounded-2xl mb-2 shadow-lg" style={{height:'84px',objectPosition:'top'}}/>
            <span className="text-white font-black text-sm leading-tight text-center">{pl.name}</span>
          </button>
        ))}
      </div>
    </div>
  );

  // Результат
  if(phase==='result'&&winnerPlayer) return(
    <div className="min-h-screen bg-gradient-to-br from-indigo-950 via-blue-950 to-indigo-950 flex flex-col items-center justify-center p-6 text-center pop">
      <p className="text-blue-300 text-xs uppercase tracking-widest mb-3 opacity-60">{questions[qIdx]}</p>
      {tie&&<div className="bg-yellow-500 bg-opacity-20 border border-yellow-500 rounded-full px-4 py-1 text-yellow-300 text-sm font-bold mb-3">Ничья — пьют все!</div>}
      <div className="relative mb-4">
        <img src={`chars/char${winnerPlayer.charId}.jpg`} className="w-32 object-cover rounded-3xl mx-auto border-4 border-yellow-400 shadow-2xl" style={{height:'160px',objectPosition:'top'}}/>
        <div className="absolute -top-3 -right-3 text-4xl">👑</div>
      </div>
      <div className="text-5xl font-black text-yellow-300 mb-1">{winnerPlayer.name}</div>
      <div className="text-2xl text-white mb-2">пьёт! 🍺</div>

const MOVES=[{id:'r',emoji:'✊',name:'Камень'},{id:'p',emoji:'✋',name:'Бумага'},{id:'s',emoji:'✌️',name:'Ножницы'}];
function knbWinner(a,b){
  if(a===b)return'tie';
  if((a==='r'&&b==='s')||(a==='p'&&b==='r')||(a==='s'&&b==='p'))return'p1';
  return'p2';
}

function KNBGame({onBack}){
  const[phase,setPhase]=useState('setup'); // setup | p1 | pass | p2 | result

  const[scores,setScores]=useState({p1:0,p2:0});

  function pickMove1(move){setP1move(move);setPhase('pass');}
  function pickMove2(move){
    setP2move(move);setPhase('result');
    const w=knbWinner(p1move,move);
    if(w!=='tie')setScores(s=>({...s,[w]:s[w]+1}));

  const mv1=MOVES.find(m=>m.id===p1move);

        <span className="text-stone-500 text-lg font-black">VS</span>
        <div className="flex items-center gap-2"><span className="text-cyan-300 font-bold text-sm">{scores.p2}</span><img src={`chars/char${avatar2}.jpg`} className="w-10 h-12 object-cover rounded-xl border-2 border-cyan-400" style={{objectPosition:'top'}}/></div>

/* ═══════════════ 7. ДЕЛИМ СЧЁТ ═══════════════ */
function BillGame({onBack}){
  const[phase,setPhase]=useState('setup');
  const[players,setPlayers]=useState([]);
  const[amount,setAmount]=useState('');
  const[rotation,setRotation]=useState(0);
  const[spinning,setSpinning]=useState(false);
  const[winner,setWinner]=useState(null);

  function togglePlayer(id){
    if(players.find(p=>p.charId===id)){setPlayers(players.filter(p=>p.charId!==id));}
    else if(players.length<8){setPlayers([...players,{charId:id,name:CHAR_NAMES[id-1]}]);}
  }
  function renamePlayer(id,name){setPlayers(players.map(p=>p.charId===id?{...p,name}:p));}

  function spin(){
    if(spinning||players.length<2)return;
    setWinner(null);setSpinning(true);
    const wi=Math.floor(Math.random()*players.length);
    const seg=360/players.length;
    const targetR=rotation+(5+Math.floor(Math.random()*5))*360+(wi+0.5)*seg;
    setRotation(targetR);
    setTimeout(()=>{setSpinning(false);setWinner(players[wi]);},4000);
  }

  const total=parseFloat(amount)||0;
  const payers=winner?players.filter(p=>p.charId!==winner.charId):players;
  const perPerson=payers.length>0?total/payers.length:0;
  const cx=150,cy=150,r=128,n=players.length||1;

  if(phase==='spin') return(
    <div className="min-h-screen bg-gradient-to-br from-emerald-950 via-stone-900 to-emerald-950 flex flex-col items-center p-4 overflow-y-auto">
      <div className="w-full max-w-sm">
        <BackBtn onBack={()=>{setPhase('setup');setWinner(null);}} light/>
        <h1 className="text-2xl font-black text-emerald-100 text-center mb-1">💵 Делим счёт</h1>
        <p className="text-emerald-400 text-sm text-center mb-3 opacity-80">Итого: <span className="font-black text-white">{total.toLocaleString('ru-RU')} сум</span> · {players.length} чел.</p>
        <div className="relative flex justify-center mb-4">
          <svg viewBox="0 0 300 300" className="w-72 h-72">
            <polygon points="150,26 141,4 159,4" fill="#fbbf24" stroke="#92400e" strokeWidth="1.5"/>
            <g style={{transformOrigin:'150px 150px',transform:`rotate(${rotation}deg)`,transition:spinning?'transform 4s cubic-bezier(0.17,0.67,0.1,1)':'none'}}>
              {players.map((pl,i)=>{
                const seg=360/n,startD=i*seg,endD=(i+1)*seg;
                const sR=(startD-90)*Math.PI/180,eR=(endD-90)*Math.PI/180;
                const x1=cx+r*Math.cos(sR),y1=cy+r*Math.sin(sR),x2=cx+r*Math.cos(eR),y2=cy+r*Math.sin(eR);
                const path=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${seg>180?1:0} 1 ${x2} ${y2} Z`;
                const midD=(startD+endD)/2,midR=(midD-90)*Math.PI/180;
                const lx=cx+r*0.65*Math.cos(midR),ly=cy+r*0.65*Math.sin(midR);
                const nm=pl.name.length>8?pl.name.slice(0,7)+'…':pl.name;
                return(<g key={i}><path d={path} fill={WHEEL_COLORS[i%WHEEL_COLORS.length]} stroke="#fff" strokeWidth="2"/><text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fill="#fff" fontSize={pl.name.length>6?'9':'11'} fontWeight="bold" transform={`rotate(${midD},${lx},${ly})`}>{nm}</text></g>);
              })}
              <circle cx={cx} cy={cy} r="18" fill="#1f2937" stroke="#fff" strokeWidth="2"/>
            </g>
          </svg>
        </div>
        {!winner&&<button onClick={spin} disabled={spinning} className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black text-2xl active:scale-95 disabled:opacity-50 shadow-lg mb-3">{spinning?'⏳ Крутим...':'КРУТИТЬ!'}</button>}
        {winner&&(
          <div className="pop w-full">
            <div className="flex flex-col items-center mb-4">
              <div className="relative mb-2">
                <img src={`chars/char${winner.charId}.jpg`} className="w-24 h-32 object-cover rounded-2xl border-4 border-emerald-400 shadow-xl" style={{objectPosition:'top'}}/>
                <div className="absolute -top-2 -right-2 bg-emerald-400 text-stone-900 text-xs font-black px-2 py-1 rounded-full">НЕ ПЛАТИТ</div>
              </div>
              <div className="text-3xl font-black text-emerald-300">{winner.name} 🎉</div>
              <div className="text-stone-400 text-sm">вытащил счастливый билет</div>
            </div>
            <div className="bg-stone-800 rounded-2xl p-4 mb-4">
              <div className="text-center mb-3">
                <div className="text-stone-400 text-xs uppercase tracking-widest mb-1">С каждого</div>
                <div className="text-5xl font-black text-amber-300">{Math.ceil(perPerson).toLocaleString('ru-RU')} сум</div>
                <div className="text-stone-500 text-xs mt-1">итого {total.toLocaleString('ru-RU')} сум / {payers.length} чел.</div>
              </div>
              <div className="space-y-2">
                {payers.map(p=>(
                  <div key={p.charId} className="flex items-center gap-3 bg-stone-700 rounded-xl px-3 py-2">
                    <img src={`chars/char${p.charId}.jpg`} className="w-8 h-10 object-cover rounded-lg flex-shrink-0" style={{objectPosition:'top'}}/>
                    <span className="text-white font-bold flex-1">{p.name}</span>
                    <span className="text-amber-300 font-black text-lg">{Math.ceil(perPerson).toLocaleString('ru-RU')} сум</span>
                  </div>
                ))}
              </div>
            </div>
            <button onClick={()=>setWinner(null)} className="w-full py-3 bg-stone-700 text-white rounded-xl font-bold active:scale-95 mb-2">🔄 Крутить снова</button>
          </div>
        )}
      </div>
    </div>
  );

  return(
    <div className="min-h-screen bg-gradient-to-br from-emerald-950 via-stone-900 to-emerald-950 flex flex-col p-4">
      <BackBtn onBack={onBack} light/>
      <h1 className="text-2xl font-black text-emerald-100 text-center mb-1">💵 Делим счёт</h1>
      <p className="text-emerald-300 text-xs text-center mb-4 opacity-70">Победитель рулетки не платит</p>
      <div className="mb-4">
        <label className="text-emerald-300 text-xs font-bold uppercase tracking-widest block mb-2">Сумма счёта</label>
        <div className="flex gap-2">
          <div className="relative flex-1">
            <input type="number" inputMode="numeric" value={amount} onChange={e=>setAmount(e.target.value)}
              placeholder="0"
              className="w-full bg-stone-800 text-white text-4xl font-black px-4 py-4 rounded-2xl border-2 border-stone-600 outline-none text-center focus:border-emerald-500"/>
            <span className="absolute right-3 top-1/2 -translate-y-1/2 text-stone-500 text-sm font-bold">сум</span>
          </div>
          <button onClick={()=>setAmount(a=>a?String(Number(a)*1000):'')}
            className="bg-stone-700 text-emerald-300 font-black text-xl rounded-2xl px-4 active:scale-95 border-2 border-stone-600">
            ×1000
          </button>
        </div>
        <div className="flex gap-2 mt-2">
          {[1000000,1250000,2000000].map(v=>(
            <button key={v} onClick={()=>setAmount(String(v))}
              className="flex-1 bg-stone-800 text-stone-300 text-xs font-bold py-2 rounded-xl active:scale-95 border border-stone-700">
              {v.toLocaleString('ru-RU')}
            </button>
          ))}
        </div>
        {players.length>=2&&total>0&&(
          <div className="mt-2 text-center text-stone-400 text-sm">
            Если без везунчика: <span className="text-amber-300 font-black">{Math.ceil(total/(players.length-1)).toLocaleString('ru-RU')} сум</span> с каждого
          </div>
        )}
      </div>
      <p className="text-emerald-300 text-xs text-center mb-2 opacity-70">Выбери игроков (мин. 2)</p>
      <AvatarPicker players={players} onToggle={togglePlayer} onRename={renamePlayer} borderColor="border-emerald-400"/>
      <button onClick={()=>setPhase('spin')} disabled={players.length<2||total<=0}
        className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black text-xl active:scale-95 disabled:opacity-40 shadow-lg mt-4">
        КРУТИТЬ РУЛЕТКУ
      </button>
    </div>
  );
}

function getPlayerId(){

  if(!id){id=Math.random().toString(36).slice(2,10);sessionStorage.setItem('beerId',id);}
  return id;
}
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('');
}

const M_FACES=['😊','😎','😤','🤩','😏','🤓','🥸','🤠','😂','😮','🙄','🥳'];
const F_FACES=['🥰','😊','😎','🤩','😋','🥳','😌','🤗','😇','🤪','😜','💁'];

function CustomAvatar({gender,faceIdx,size='md'}){
  const faces=gender==='ж'?F_FACES:M_FACES;
  const face=faces[faceIdx]||faces[0];
  const bg=gender==='ж'?'from-pink-600 to-rose-800':'from-blue-600 to-blue-800';
  const border=gender==='ж'?'border-pink-400':'border-blue-400';
  const sz={sm:'w-10 h-10 text-xl',md:'w-12 h-14 text-3xl',lg:'w-20 h-20 text-5xl'};
  return(<div className={`${sz[size]} bg-gradient-to-br ${bg} rounded-xl flex items-center justify-center border-2 ${border} flex-shrink-0`}>{face}</div>);
}
function PlayerAvatar({player,size='md'}){
  if(player&&player.charIdx){
    const sz={sm:'w-10 h-10',md:'w-12 h-14',lg:'w-20 h-20'};
    return(<img src={`chars/char${player.charIdx}.jpg`} className={`${sz[size]} object-cover rounded-xl border-2 border-stone-600 flex-shrink-0`} style={{objectPosition:'top'}}/>);
  }
  return(<CustomAvatar gender={player&&player.gender||'м'} faceIdx={player&&player.faceIdx||0} size={size}/>);
}

/* ═══════════════ ONLINE SETUP ═══════════════ */
function OnlineSetup({onBack,onDone}){
  const[step,setStep]=useState('form');
  const[name,setName]=useState('');
  const[avatarType,setAvatarType]=useState('preset');
  const[charIdx,setCharIdx]=useState(1);
  const[gender,setGender]=useState('м');
  const[faceIdx,setFaceIdx]=useState(0);
  const[code,setCode]=useState('');
  const[loading,setLoading]=useState(false);
  const[profileLoading,setProfileLoading]=useState(true);
  const[error,setError]=useState('');

  useEffect(()=>{
    const rp=new URLSearchParams(window.location.search).get('room');
    firebase.database().ref('users/'+getPlayerId()).get().then(snap=>{
      if(snap.exists()){
        const p=snap.val();
        if(p.charIdx){setAvatarType('preset');setCharIdx(p.charIdx);if(!p.name)setName(CHAR_NAMES[p.charIdx-1]);}
        else{setAvatarType('custom');if(p.gender)setGender(p.gender);if(p.faceIdx!=null)setFaceIdx(p.faceIdx);}
        if(p.name)setName(p.name);
        if(rp&&rp.length===4){setCode(rp.toUpperCase());}
      } else {
        setName(CHAR_NAMES[0]);
        if(rp&&rp.length===4){setCode(rp.toUpperCase());}
      }
      setProfileLoading(false);
    }).catch(()=>setProfileLoading(false));
  },[]);

  function getProfile(){
    const base={name:name.trim(),updatedAt:Date.now()};
    if(avatarType==='preset')return{...base,charIdx,gender:null,faceIdx:null};
    return{...base,charIdx:null,gender,faceIdx};
  }
  function validate(){
    if(!name.trim())return'Введи имя';
    return null;
  }
  function saveAndCreate(){
    const err=validate();if(err){setError(err);return;}
    setLoading(true);
    const playerId=getPlayerId();
    const roomCode=genCode();
    const profile=getProfile();
    const db=firebase.database();
    Promise.all([
      db.ref('users/'+playerId).set(profile),
      db.ref('rooms/'+roomCode).set({host:playerId,createdAt:Date.now(),game:null,
        players:{[playerId]:{...profile,joinedAt:Date.now()}}})
    ]).then(()=>onDone({code:roomCode,playerId,isHost:true}))
      .catch(()=>{setError('Ошибка соединения');setLoading(false);});
  }
  function goJoin(){
    const err=validate();if(err){setError(err);return;}
    setError('');setStep('joining');
  }
  function doJoin(){
    if(code.length!==4){setError('Код — 4 символа');return;}
    setLoading(true);
    const playerId=getPlayerId();
    const uCode=code.toUpperCase();
    const profile=getProfile();
    const db=firebase.database();
    db.ref('rooms/'+uCode).get().then(snap=>{
      if(!snap.exists()){setError('Комната не найдена');setLoading(false);return;}
      const cnt=Object.keys(snap.val().players||{}).length;
      if(cnt>=8){setError('Комната заполнена');setLoading(false);return;}
      return Promise.all([
        db.ref('users/'+playerId).set(profile),
        db.ref('rooms/'+uCode+'/players/'+playerId).set({...profile,joinedAt:Date.now()})
      ]).then(()=>onDone({code:uCode,playerId,isHost:false}));
    }).catch(()=>{setError('Ошибка соединения');setLoading(false);});
  }

  if(profileLoading||loading)return(
    <div className="min-h-screen bg-stone-950 flex items-center justify-center">
      <div className="text-white text-xl animate-pulse">{loading?'⏳ Подключение...':'Загрузка...'}</div>
    </div>
  );

  if(step==='joining')return(
    <div className="min-h-screen bg-stone-950 flex flex-col p-6 pt-10">
      <button onClick={()=>{setStep('form');setError('');}} className="text-stone-400 text-sm mb-6 text-left">← Назад</button>
      <h2 className="text-2xl font-black text-white mb-2">Войти в комнату</h2>
      <p className="text-stone-400 text-sm mb-6">Попроси хоста показать код</p>
      <input value={code} onChange={e=>setCode(e.target.value.toUpperCase())} maxLength={4}
        className="w-full bg-stone-800 text-white text-center text-5xl font-black tracking-widest rounded-2xl p-4 border-2 border-stone-600 focus:border-amber-500 outline-none mb-3"
        placeholder="XXXX" autoFocus/>
      {error&&<p className="text-red-400 text-sm mb-3 text-center">{error}</p>}
      <button onClick={doJoin} className="w-full py-4 bg-amber-500 text-stone-900 rounded-2xl font-black text-xl active:scale-95 transition-transform">Войти →</button>
    </div>
  );

  const faces=gender==='ж'?F_FACES:M_FACES;
  return(
    <div className="min-h-screen bg-stone-950 flex flex-col p-4 overflow-y-auto">
      <button onClick={onBack} className="text-stone-400 text-sm mb-4">← Назад</button>

      <h2 className="text-xl font-black text-white mb-2">Как тебя зовут?</h2>
      <input value={name} onChange={e=>setName(e.target.value)} maxLength={12}
        className="w-full bg-stone-800 text-white text-xl font-bold rounded-2xl p-3 border-2 border-stone-600 focus:border-amber-500 outline-none mb-4"
        placeholder="Твоё имя"/>

      <div className="flex gap-2 mb-4">
        <button onClick={()=>setAvatarType('preset')}
          className={'flex-1 py-2.5 rounded-xl font-bold text-sm transition-all '+(avatarType==='preset'?'bg-amber-500 text-stone-900':'bg-stone-800 text-stone-400')}>
          👥 Команда
        </button>
        <button onClick={()=>setAvatarType('custom')}
          className={'flex-1 py-2.5 rounded-xl font-bold text-sm transition-all '+(avatarType==='custom'?'bg-purple-600 text-white':'bg-stone-800 text-stone-400')}>
          ✏️ Свой аватар
        </button>
      </div>

      {avatarType==='preset'&&(
        <div className="grid grid-cols-4 gap-2 mb-4">
          {[1,2,3,4,5,6,7,8].map(i=>(
            <button key={i} onClick={()=>{setCharIdx(i);setName(CHAR_NAMES[i-1]);}}
              className={'rounded-2xl overflow-hidden border-4 transition-all '+(charIdx===i?'border-amber-400 scale-105 shadow-lg shadow-amber-900':'border-stone-700 opacity-60')}>
              <img src={`chars/char${i}.jpg`} className="w-full" style={{aspectRatio:'3/4',objectFit:'cover',objectPosition:'top'}}/>
              <div className="bg-stone-900 text-center text-xs text-stone-300 py-0.5 truncate px-1">{CHAR_NAMES[i-1]}</div>
            </button>
          ))}
        </div>
      )}

      {avatarType==='custom'&&(
        <div className="mb-4">
          <div className="flex gap-2 mb-3">
            <button onClick={()=>setGender('м')} className={'flex-1 py-3 rounded-xl font-bold text-base transition-all '+(gender==='м'?'bg-blue-600 text-white':'bg-stone-800 text-stone-400')}>
              👨 Мужской
            </button>
            <button onClick={()=>setGender('ж')} className={'flex-1 py-3 rounded-xl font-bold text-base transition-all '+(gender==='ж'?'bg-pink-600 text-white':'bg-stone-800 text-stone-400')}>
              👩 Женский
            </button>
          </div>
          <p className="text-stone-400 text-xs mb-2">Выбери лицо:</p>
          <div className="grid grid-cols-6 gap-2 mb-3">
            {faces.map((face,i)=>(
              <button key={i} onClick={()=>setFaceIdx(i)}
                className={'aspect-square rounded-2xl flex items-center justify-center text-2xl border-2 transition-all '+(faceIdx===i?(gender==='м'?'bg-blue-800 border-blue-400 scale-110':'bg-pink-800 border-pink-400 scale-110'):'bg-stone-800 border-stone-700 opacity-70')}>
                {face}
              </button>
            ))}
          </div>
          <div className="flex items-center gap-3 bg-stone-900 rounded-xl p-3">
            <CustomAvatar gender={gender} faceIdx={faceIdx} size="md"/>
            <div>
              <div className="text-white font-bold text-sm">{name||'Твоё имя'}</div>
              <div className="text-stone-400 text-xs">{gender==='м'?'Мужской':'Женский'} · лицо {faceIdx+1}</div>
            </div>
          </div>
        </div>
      )}

      {error&&<p className="text-red-400 text-sm mb-3 text-center">{error}</p>}
      <div className="flex gap-3 mt-2 pb-4">
        {code.length===4?(
          <button onClick={doJoin} className="w-full py-4 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-2xl font-black text-lg active:scale-95 transition-transform shadow-lg">
            → Войти в комнату {code}
          </button>
        ):(
          <>
            <button onClick={saveAndCreate} className="flex-1 py-4 bg-gradient-to-r from-emerald-600 to-emerald-700 text-white rounded-2xl font-bold active:scale-95 transition-transform shadow-lg">
              + Создать<br/><span className="text-xs font-normal opacity-80">новую комнату</span>
            </button>
            <button onClick={goJoin} className="flex-1 py-4 bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-2xl font-bold active:scale-95 transition-transform shadow-lg">
              → Войти<br/><span className="text-xs font-normal opacity-80">по коду</span>
            </button>
          </>
        )}
      </div>
    </div>
  );
}

/* ═══════════════ LOBBY SCREEN ═══════════════ */
function LobbyScreen({code,playerId,isHost,onBack,onStart}){
  const[room,setRoom]=useState(null);
  const[selectedGame,setSelectedGame]=useState('roulette');
  const[copied,setCopied]=useState(false);
  const[qrUrl,setQrUrl]=useState(null);
  const navigated=useRef(false);
  useEffect(()=>{
    const url=`https://alud.github.io/BeerRoulette/?room=${code}`;
    if(typeof QRCode!=='undefined'){QRCode.toDataURL(url,{width:180,margin:1}).then(du=>setQrUrl(du)).catch(()=>{});}
  },[code]);

  useEffect(()=>{
    const db=firebase.database();
    const ref=db.ref('rooms/'+code);
    ref.on('value',snap=>{
      const val=snap.val();
      if(!val)return;
      setRoom(val);
      if(val.game&&!navigated.current){
        navigated.current=true;
        onStart(val.game);
      }
    });
    return()=>ref.off();
  },[]);

  function handleBack(){
    if(isHost)firebase.database().ref('rooms/'+code).remove();
    else firebase.database().ref('rooms/'+code+'/players/'+playerId).remove();
    onBack();
  }
  const joinUrl=`https://alud.github.io/BeerRoulette/?room=${code}`;
  function copyCode(){
    if(navigator.clipboard){navigator.clipboard.writeText(joinUrl);}
    else{window.prompt('Скопируй ссылку:',joinUrl);}
    setCopied(true);setTimeout(()=>setCopied(false),2000);
  }
  function startGame(){
    const db=firebase.database();
    let gs={};
    if(selectedGame==='roulette'){gs={phase:'playing',bulletIdx:Math.floor(Math.random()*6),revealed:{},loser:null};}
    else if(selectedGame==='bomba'){gs={phase:'setup',duration:30,currentHolder:null,explodedPlayer:null};}
    else if(selectedGame==='names'){gs={phase:'idle',winnerIdx:null};}
    else if(selectedGame==='ktoiznas'){gs={phase:'voting',questionIdx:Math.floor(Math.random()*QUESTIONS.length),votes:{}};}
    else if(selectedGame==='svetofor'){gs={phase:'ready',loser:null};}
    else if(selectedGame==='knb'){gs={phase:'picking',picks:{},round:1};}
    db.ref('rooms/'+code).update({game:selectedGame,gameState:gs});
  }

  const players=room?Object.entries(room.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.joinedAt-b.joinedAt):[];

  return(
    <div className="min-h-screen bg-stone-950 flex flex-col p-4">
      <button onClick={handleBack} className="text-stone-400 text-sm mb-4 text-left">← Выйти</button>

      <div className="bg-stone-900 border border-stone-700 rounded-2xl p-4 mb-4 text-center">
        <p className="text-stone-500 text-xs mb-1">Нажми — скопируется ссылка для друзей</p>
        <button onClick={copyCode} className="text-5xl font-black text-amber-400 tracking-widest block w-full active:opacity-60">
          {code}
        </button>
        <p className={`text-xs mt-1 transition-opacity ${copied?'text-green-400':'text-transparent'}`}>✓ Ссылка скопирована</p>
        {qrUrl&&<div className="mt-2"><img src={qrUrl} alt="QR" className="mx-auto rounded-lg" style={{width:96,height:96}}/><p className="text-stone-500 text-xs mt-1">Отсканируй для входа</p></div>}
      </div>

      <div className="bg-stone-900 border border-stone-700 rounded-2xl p-4 mb-4 flex-1">
        <p className="text-stone-500 text-xs mb-3">Игроки ({players.length}/8)</p>
        <div className="space-y-2">
          {players.map(p=>(
            <div key={p.id} className={'flex items-center gap-3 rounded-xl p-2 '+(p.id===playerId?'bg-stone-800 ring-1 ring-amber-700':'')}>
              <PlayerAvatar player={p} size="md"/>
              <div>
                <div className="text-white font-bold text-sm">{p.name}{p.id===playerId&&<span className="text-stone-500 text-xs ml-1">(ты)</span>}</div>
                {room&&p.id===room.host&&<div className="text-amber-400 text-xs">👑 Хост</div>}
              </div>
            </div>
          ))}
          {players.length===0&&<div className="text-stone-600 text-sm text-center py-3">Загрузка...</div>}
        </div>
        {players.length>0&&players.length<2&&<p className="text-stone-600 text-xs text-center mt-3">Ждём ещё игроков...</p>}
      </div>

      {isHost&&(
        <div className="space-y-3">
          <p className="text-stone-400 text-xs">Выбери игру:</p>
          <div className="grid grid-cols-4 gap-2">
            {MENU.filter(g=>g.id!=='bill').map(g=>(
              <button key={g.id} onClick={()=>setSelectedGame(g.id)}
                className={`bg-gradient-to-br ${g.from} ${g.to} border ${g.border} rounded-xl p-2 text-center transition-all active:scale-95 `+(selectedGame===g.id?'ring-2 ring-white opacity-100':'opacity-50')}>
                <div className="text-xl">{g.emoji}</div>
                <div className="text-white text-xs leading-tight mt-1">{g.name.split(' ')[0]}</div>
              </button>
            ))}
          </div>
          <button onClick={startGame} className="w-full py-4 bg-gradient-to-r from-amber-500 to-orange-500 text-stone-900 rounded-2xl font-black text-lg active:scale-95 transition-transform shadow-xl">
            🚀 Начать игру
          </button>
        </div>
      )}
      {!isHost&&(
        <div className="text-center text-stone-500 py-3">
          <div className="text-3xl mb-2 animate-pulse">⏳</div>
          <div className="text-sm">Хост выбирает игру...</div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════ ONLINE GAMES ═══════════════ */
function BackToLobbyBtn({isHost,onEndGame,onLeave}){
  if(isHost)return(<button onClick={onEndGame} className="text-stone-400 text-sm mb-4 block w-full text-left">← Сменить игру</button>);
  return(<button onClick={onLeave} className="text-amber-500 text-sm mb-4 block w-full text-left">← Выйти из комнаты</button>);
}

function OnlineRouletteGame({gameState,players,playerId,isHost,updateState,endGame,onLeave}){
  const{phase='playing',bulletIdx=0,revealed={},loser=null}=gameState;
  const[drumRotation,setDrumRotation]=useState(0);
  const[animating,setAnimating]=useState(false);
  const[flash,setFlash]=useState(false);
  const[muzzle,setMuzzle]=useState(false);
  const loserPlayer=loser?players.find(p=>p.id===loser):null;
  function pick(idx){
    if(revealed[idx]||phase!=='playing'||animating)return;
    setAnimating(true);setDrumRotation(r=>r+1080+Math.random()*360);
    setTimeout(()=>{
      setAnimating(false);const nr={...revealed,[idx]:playerId};
      if(idx===bulletIdx){
        playGunshot();setMuzzle(true);setTimeout(()=>setMuzzle(false),200);
        setFlash(true);setTimeout(()=>setFlash(false),200);
        updateState({revealed:nr,loser:playerId,phase:'result'});
      } else if(Object.keys(nr).length===5){updateState({revealed:nr,phase:'result',loser:null});}
      else{updateState({revealed:nr});}
    },800);
  }
  function restart(){setDrumRotation(r=>r+1080);updateState({phase:'playing',bulletIdx:Math.floor(Math.random()*6),revealed:{},loser:null});}
  return(
    <div className="min-h-screen bg-gradient-to-br from-amber-950 via-stone-900 to-amber-950 flex items-start justify-center py-4 px-3 overflow-x-hidden relative">
      {flash&&<div className="fixed inset-0 bg-amber-300 pointer-events-none flash z-50"/>}
      <div className="max-w-lg w-full relative z-10">
        <BackToLobbyBtn isHost={isHost} onEndGame={endGame} onLeave={onLeave}/>
        <div className="text-center mb-2">
          <h1 className="text-3xl font-black text-amber-100 mb-0.5 tracking-tight" style={{textShadow:'0 0 30px rgba(251,191,36,0.5)'}}>🍺 ПИВНАЯ РУЛЕТКА</h1>
          <p className="text-amber-200 opacity-50 text-xs">5 целых · 1 ловушка</p>
        </div>
        <div className="flex justify-center mb-2"><div className="w-52 h-32 sm:w-64 sm:h-40"><RevolverClassic rotation={drumRotation} spinning={animating} muzzle={muzzle}/></div></div>
        <div className="bg-stone-800 bg-opacity-80 border border-amber-700 rounded-xl px-4 py-3 mb-3 text-center">
          <div className="text-base text-amber-50 font-medium leading-snug" style={{minHeight:'24px'}}>
            {phase==='playing'?'Выбери кружку...':loserPlayer?loserPlayer.name+' пьёт штрафную! 💥':'🎉 Все кружки целы!'}
          </div>
        </div>
        <div className="grid grid-cols-3 gap-2 mb-3">
          {[0,1,2,3,4,5].map(idx=>{
            const revId=revealed[idx];const isRev=!!revId;const showRes=isRev||phase==='result';const isLose=idx===bulletIdx;
            const revP=revId?players.find(p=>p.id===revId):null;
            return(<button key={idx} id={'cell-'+idx} onClick={()=>pick(idx)} disabled={isRev||phase!=='playing'||animating}
              className={'aspect-square rounded-xl transition-all duration-300 relative overflow-hidden p-1.5 active:scale-95 '+(!showRes?'bg-gradient-to-br from-stone-700 to-stone-900 border-2 border-amber-700':isLose?'bg-gradient-to-br from-red-700 via-amber-800 to-stone-900 border-2 border-red-500':'bg-gradient-to-br from-amber-500 to-amber-700 border-2 border-amber-300')+(animating?' animate-pulse':'')}>
              {!showRes&&<div className="flex items-center justify-center h-full"><span className="text-2xl text-amber-200 opacity-40 font-mono font-bold">{idx+1}</span></div>}
              {showRes&&(isLose?<BrokenMug/>:<BeerMug/>)}
              {revP&&<div className="absolute bottom-0 inset-x-0 text-center text-xs text-white bg-black bg-opacity-50 rounded-b-xl py-0.5 truncate px-1">{revP.name}</div>}
            </button>);
          })}
        </div>
        {phase==='result'&&(
          <div className={'rounded-2xl p-4 text-center mb-3 '+(loserPlayer?'bg-red-950 border border-red-600':'bg-amber-950 border border-amber-600')}>
            {loserPlayer&&<><div className="flex justify-center mb-2"><PlayerAvatar player={loserPlayer} size="lg"/></div><div className="text-white font-black text-xl">{loserPlayer.name} пьёт штрафную! 💥</div></>}
            {!loserPlayer&&<div className="text-amber-300 font-black text-xl">🎉 Все кружки целы!</div>}
          </div>
        )}
        {phase==='result'&&isHost&&(<div className="flex gap-3">
          <button onClick={restart} className="flex-1 py-3 bg-amber-500 text-stone-900 rounded-xl font-bold active:scale-95">🔄 Ещё раз</button>
          <button onClick={endGame} className="py-3 px-4 bg-stone-800 text-stone-400 rounded-xl font-bold active:scale-95">Сменить игру</button>
        </div>)}
      </div>
    </div>
  );
}

function OnlineBombaGame({gameState,players,playerId,isHost,updateState,endGame,onLeave}){
  const{phase='setup',duration=30,startTime,currentHolder,explodedPlayer}=gameState;
  const[timeLeft,setTimeLeft]=useState(duration);
  const myTurn=currentHolder===playerId;
  const explodedRef=useRef(false);
  useEffect(()=>{
    if(phase!=='ticking')return;
    explodedRef.current=false;
    const id=setInterval(()=>{
      const left=Math.max(0,duration-(Date.now()-startTime)/1000);
      setTimeLeft(Math.ceil(left));
      if(left<=0&&!explodedRef.current&&currentHolder===playerId){
        explodedRef.current=true;
        updateState({phase:'exploded',explodedPlayer:playerId});
      }
    },200);
    return()=>clearInterval(id);
  },[phase,startTime,currentHolder]);
  function startBomb(){
    const holder=players[Math.floor(Math.random()*players.length)].id;
    updateState({phase:'ticking',startTime:Date.now(),currentHolder:holder,explodedPlayer:null,duration});
  }
  function pass(){
    const i=players.findIndex(p=>p.id===currentHolder);
    updateState({currentHolder:players[(i+1)%players.length].id});
  }
  const holderPlayer=players.find(p=>p.id===currentHolder);
  const explodedP=explodedPlayer?players.find(p=>p.id===explodedPlayer):null;
  const danger=timeLeft<=10&&phase==='ticking';
  if(phase==='setup')return(
    <div className="min-h-screen bg-stone-950 flex flex-col items-center justify-center p-6 text-center">
      <div className="absolute top-4 left-4"><BackToLobbyBtn isHost={isHost} onEndGame={endGame} onLeave={onLeave}/></div>
      <div className="text-8xl mb-6">🧨</div><h2 className="text-2xl font-black text-white mb-6">Бомба</h2>
      {isHost&&<button onClick={startBomb} className="w-full max-w-xs py-5 bg-red-600 text-white rounded-2xl font-black text-xl active:scale-95">🔥 Поджечь!</button>}
      {!isHost&&<p className="text-stone-500">Ждём хоста...</p>}
    </div>
  );
  if(phase==='exploded')return(
    <div className="min-h-screen bg-red-950 flex flex-col items-center justify-center p-6 text-center">
      <div className="text-8xl mb-4 boom">💥</div>
      {explodedP&&<><div className="flex justify-center mb-3"><PlayerAvatar player={explodedP} size="lg"/></div><div className="text-white font-black text-2xl">{explodedP.name} пьёт! 🍺</div></>}
      {isHost&&<div className="flex gap-3 mt-6">
        <button onClick={()=>updateState({phase:'setup',currentHolder:null,explodedPlayer:null})} className="px-5 py-3 bg-amber-600 text-white rounded-xl font-bold active:scale-95">Ещё раз</button>
        <button onClick={endGame} className="px-5 py-3 bg-stone-800 text-stone-400 rounded-xl font-bold active:scale-95">Лобби</button>
      </div>}
    </div>
  );
  return(
    <div className={`min-h-screen flex flex-col items-center justify-center p-6 text-center relative overflow-hidden ${danger?'bg-red-950':'bg-stone-950'}`}>
      {danger&&<div className="fixed inset-0 bg-red-500 pointer-events-none redflash z-10" style={{'--blink-speed':Math.max(0.12,timeLeft*0.05)+'s'}}/>}
      <div className="relative z-20 w-full">
        {myTurn?(<>
          <div className="text-8xl mb-4 animate-bounce">🧨</div>
          <div className="text-2xl font-black text-white mb-2">У тебя бомба!</div>
          {!danger&&<div className="text-7xl font-black text-red-400 mb-6 tabular-nums">{timeLeft}</div>}
          {danger&&<div className="text-7xl mb-6">❓</div>}
          <button onClick={pass} className="w-full max-w-xs py-4 bg-amber-500 text-stone-900 rounded-2xl font-black text-xl active:scale-95">Передать →</button>
        </>):(<>
          <div className="text-5xl mb-4">😰</div>
          <div className="text-stone-400 mb-1">Бомба у</div>
          {holderPlayer&&<div className="text-2xl font-black text-white mb-3">{holderPlayer.name}</div>}
          {holderPlayer&&<div className="flex justify-center mb-3"><PlayerAvatar player={holderPlayer} size="lg"/></div>}
          {!danger&&<div className="text-5xl font-black text-red-400 tabular-nums">{timeLeft}</div>}
          {danger&&<div className="text-5xl">❓</div>}
        </>)}
      </div>
    </div>
  );
}

function OnlineNamesGame({gameState,players,playerId,isHost,updateState,endGame,onLeave}){
  const{phase='idle',winnerIdx=null}=gameState;
  const[localRotation,setLocalRotation]=useState(0);
  const[localSpinning,setLocalSpinning]=useState(false);
  const prevPhaseRef=useRef('idle');
  const n=players.length||1;
  const cx=150,cy=150,r=128;
  const winner=winnerIdx!=null?players[winnerIdx%n]:null;
  useEffect(()=>{
    if(phase==='spinning'&&prevPhaseRef.current!=='spinning'&&winnerIdx!=null){
      const seg=360/n;
      const extra=(5+Math.floor(Math.random()*5))*360;
      setLocalRotation(rot=>{const base=Math.ceil((rot+1)/360)*360;return base+extra+winnerIdx*seg+seg/2;});
      setLocalSpinning(true);
      setTimeout(()=>setLocalSpinning(false),4000);
    }
    prevPhaseRef.current=phase;
  },[phase]);
  function spin(){
    if(localSpinning||phase==='spinning')return;
    const wi=Math.floor(Math.random()*players.length);
    updateState({phase:'spinning',winnerIdx:wi});
    setTimeout(()=>updateState({phase:'result'}),4200);
  }
  return(
    <div className="min-h-screen bg-gradient-to-br from-purple-950 via-stone-900 to-purple-950 flex flex-col items-center p-4">
      <BackToLobbyBtn isHost={isHost} onEndGame={endGame} onLeave={onLeave}/>
      <h1 className="text-2xl font-black text-purple-100 text-center mb-3">🎰 Рулетка имён</h1>
      <div className="relative mb-4">
        <svg viewBox="0 0 300 300" className="w-72 h-72">
          <polygon points="150,26 141,4 159,4" fill="#fbbf24" stroke="#92400e" strokeWidth="1.5"/>
          <g style={{transformOrigin:'150px 150px',transform:`rotate(${localRotation}deg)`,transition:localSpinning?'transform 4s cubic-bezier(0.17,0.67,0.1,1)':'none'}}>
            {players.map((pl,i)=>{
              const seg=360/n,startD=i*seg,endD=(i+1)*seg;
              const sR=(startD-90)*Math.PI/180,eR=(endD-90)*Math.PI/180;
              const x1=cx+r*Math.cos(sR),y1=cy+r*Math.sin(sR),x2=cx+r*Math.cos(eR),y2=cy+r*Math.sin(eR);
              const path=`M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${seg>180?1:0} 1 ${x2} ${y2} Z`;
              const midD=(startD+endD)/2,midR=(midD-90)*Math.PI/180;
              const lx=cx+r*0.65*Math.cos(midR),ly=cy+r*0.65*Math.sin(midR);
              const nm=pl.name.length>8?pl.name.slice(0,7)+'…':pl.name;
              return(<g key={i}><path d={path} fill={WHEEL_COLORS[i%WHEEL_COLORS.length]} stroke="#fff" strokeWidth="2"/><text x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fill="#fff" fontSize={pl.name.length>6?'9':'11'} fontWeight="bold" transform={`rotate(${midD},${lx},${ly})`}>{nm}</text></g>);
            })}
            <circle cx={cx} cy={cy} r="18" fill="#1f2937" stroke="#fff" strokeWidth="2"/>
          </g>
        </svg>
      </div>
      {(localSpinning||phase==='spinning')&&<div className="text-center text-purple-300 text-lg animate-pulse mb-4">🎰 Крутится...</div>}
      {phase==='result'&&winner&&(
        <div className="text-center pop mb-4">
          <div className="flex justify-center mb-2"><PlayerAvatar player={winner} size="lg"/></div>
          <div className="text-3xl font-black text-yellow-300 mb-1">{winner.name}</div>
          <div className="text-xl text-white mb-2">пьёт! 🍺</div>
        </div>
      )}
      {isHost&&(<div className="flex gap-3 w-full max-w-xs">
        <button onClick={spin} disabled={localSpinning||phase==='spinning'} className="flex-1 py-4 bg-purple-600 text-white rounded-2xl font-black text-lg active:scale-95 disabled:opacity-50">🎰 Крутить!</button>
        {phase==='result'&&<button onClick={endGame} className="py-4 px-4 bg-stone-800 text-stone-400 rounded-2xl font-bold active:scale-95">Лобби</button>}
      </div>)}
      {!isHost&&phase==='idle'&&<p className="text-center text-stone-500 text-sm mt-2">Хост крутит колесо...</p>}
    </div>
  );
}

function OnlineKtoIzNasGame({gameState,players,playerId,isHost,updateState,endGame,onLeave}){
  const{phase='voting',questionIdx=0,votes={}}=gameState;
  const question=QUESTIONS[questionIdx%QUESTIONS.length];
  const myVote=votes[playerId];
  const totalVotes=Object.keys(votes).length;
  const allVoted=totalVotes>=players.length;
  function vote(targetId){if(myVote)return;updateState({['votes/'+playerId]:targetId});}
  function showResult(){updateState({phase:'result'});}
  function next(){updateState({phase:'voting',questionIdx:(questionIdx+1)%QUESTIONS.length,votes:{}});}
  const voteCounts={};
  Object.values(votes).forEach(id=>{voteCounts[id]=(voteCounts[id]||0)+1;});
  const maxV=Math.max(0,...Object.values(voteCounts));
  const winners=maxV>0?players.filter(p=>voteCounts[p.id]===maxV):[];
  return(
    <div className="min-h-screen bg-stone-950 p-4 flex flex-col">
      <div className="flex justify-between items-start mb-3"><BackToLobbyBtn isHost={isHost} onEndGame={endGame} onLeave={onLeave}/><span className="text-stone-500 text-xs">{questionIdx+1}/{QUESTIONS.length}</span></div>
      <div className="bg-gradient-to-br from-blue-900 to-blue-950 border border-blue-600 rounded-2xl p-4 mb-4">
        <p className="text-blue-300 text-xs mb-1 uppercase tracking-widest">Кто из вас...</p>
        <p className="text-white font-black text-lg leading-snug">{question}</p>
        <p className="text-blue-300 text-xs mt-2">Проголосовало: {totalVotes}/{players.length}</p>
      </div>
      {phase==='voting'&&!myVote&&(<div className="grid grid-cols-2 gap-3 flex-1">
        {players.map(p=>(<button key={p.id} onClick={()=>vote(p.id)} className="flex flex-col items-center bg-stone-800 rounded-2xl p-3 active:scale-95 border-2 border-stone-700 hover:border-blue-500 transition-all">
          <PlayerAvatar player={p} size="md"/>
          <span className="text-white font-bold text-sm mt-2 text-center">{p.name}</span>
        </button>))}
      </div>)}
      {phase==='voting'&&myVote&&(<div className="flex-1 flex flex-col items-center justify-center text-center gap-4">
        <div className="text-4xl animate-pulse">⏳</div>
        <p className="text-white font-bold">Ты проголосовал</p>
        <p className="text-stone-400 text-sm">Ждём остальных...</p>
        {allVoted&&isHost&&<button onClick={showResult} className="px-6 py-3 bg-amber-500 text-stone-900 rounded-xl font-bold active:scale-95">Показать результат →</button>}
      </div>)}
      {phase==='result'&&(<div className="flex-1 flex flex-col">
        <div className="space-y-2 flex-1 overflow-auto">
          {[...players].sort((a,b)=>(voteCounts[b.id]||0)-(voteCounts[a.id]||0)).map(p=>{
            const isW=winners.find(w=>w.id===p.id);
            return(<div key={p.id} className={`flex items-center gap-3 rounded-xl p-3 ${isW?'bg-amber-900 border border-amber-500':'bg-stone-800'}`}>
              <PlayerAvatar player={p} size="sm"/>
              <span className="text-white font-bold flex-1">{p.name}</span>
              {isW&&<span className="text-lg">👑</span>}
              <span className="text-amber-400 font-black text-lg">{voteCounts[p.id]||0}</span>
            </div>);
          })}
        </div>
        {isHost&&(<div className="flex gap-3 mt-4">
          <button onClick={next} className="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold active:scale-95">Следующий →</button>
          <button onClick={endGame} className="py-3 px-4 bg-stone-800 text-stone-400 rounded-xl font-bold active:scale-95">Лобби</button>
        </div>)}
      </div>)}
    </div>
  );
}

function OnlineSvetoforGame({gameState,players,playerId,isHost,updateState,endGame,onLeave}){
  const{phase='ready',loser=null}=gameState;
  const loserPlayer=loser?players.find(p=>p.id===loser):null;
  function roll(){updateState({phase:'result',loser:players[Math.floor(Math.random()*players.length)].id});}
  function reset(){updateState({phase:'ready',loser:null});}
  return(
    <div className="min-h-screen bg-stone-950 flex flex-col items-center justify-center p-6 text-center relative">
      <div className="absolute top-4 left-4"><BackToLobbyBtn isHost={isHost} onEndGame={endGame} onLeave={onLeave}/></div>
      <h2 className="text-2xl font-black text-white mb-6">🚦 Светофор</h2>
      {phase==='ready'&&(<>
        <div className="text-8xl mb-8 animate-pulse">🚦</div>
        <p className="text-stone-400 mb-6">Кто выпьет на этот раз?</p>
        {isHost&&<button onClick={roll} className="px-10 py-5 bg-green-600 text-white rounded-2xl font-black text-2xl active:scale-95 shadow-xl">🟢 Поехали!</button>}
        {!isHost&&<p className="text-stone-500">Хост запускает...</p>}
      </>)}
      {phase==='result'&&loserPlayer&&(<>
        <div className="text-6xl mb-4">🔴</div>
        <div className="flex justify-center mb-3"><PlayerAvatar player={loserPlayer} size="lg"/></div>
        <div className="text-white font-black text-2xl">{loserPlayer.name}</div>
        <div className="text-red-400 font-bold text-lg mt-1 mb-6">Пьёт! 🍺</div>
        {isHost&&<div className="flex gap-3">
          <button onClick={reset} className="px-5 py-3 bg-stone-800 text-white rounded-xl font-bold active:scale-95">Ещё раз</button>
          <button onClick={endGame} className="px-5 py-3 bg-stone-700 text-stone-400 rounded-xl font-bold active:scale-95">Лобби</button>
        </div>}
      </>)}
    </div>
  );
}

function OnlineKNBGame({gameState,players,playerId,isHost,updateState,endGame,onLeave}){
  const{phase='picking',picks={},round=1}=gameState;
  const SYM={r:'✊',p:'✋',s:'✌️'};const NM={r:'Камень',p:'Бумага',s:'Ножницы'};
  const myPick=picks[playerId];
  const allPicked=players.length>0&&players.every(p=>picks[p.id]);
  function pick(c){if(myPick||phase!=='picking')return;updateState({['picks/'+playerId]:c});}
  useEffect(()=>{if(allPicked&&phase==='picking'&&isHost)updateState({phase:'result'});},[allPicked]);
  function getWinChoice(){
    const present=[...new Set(players.map(p=>picks[p.id]).filter(Boolean))];
    if(present.length!==2)return null;
    const[a,b]=present;
    return((a==='r'&&b==='s')||(a==='s'&&b==='p')||(a==='p'&&b==='r'))?a:b;
  }
  const winChoice=phase==='result'?getWinChoice():null;
  return(
    <div className="min-h-screen bg-stone-950 p-4 flex flex-col">
      <div className="flex justify-between items-center mb-3"><BackToLobbyBtn isHost={isHost} onEndGame={endGame} onLeave={onLeave}/><span className="text-stone-500 text-xs font-bold">Раунд {round}</span></div>
      <h2 className="text-xl font-black text-white mb-4 text-center">✊ КНБ на пьянку</h2>
      {phase==='picking'&&(<>
        {!myPick?(<>
          <p className="text-stone-400 text-center mb-4">Твой выбор:</p>
          <div className="flex justify-center gap-4 mb-6">
            {['r','p','s'].map(c=>(<button key={c} onClick={()=>pick(c)} className="w-24 h-24 bg-stone-800 rounded-2xl text-5xl flex items-center justify-center active:scale-95 border-2 border-stone-700 hover:border-amber-500 transition-all">{SYM[c]}</button>))}
          </div>
        </>):(<div className="flex flex-col items-center justify-center py-6 mb-4">
          <div className="text-6xl mb-2">{SYM[myPick]}</div>
          <p className="text-white font-bold">{NM[myPick]}</p>
          <p className="text-stone-400 text-sm mt-1 animate-pulse">Ждём остальных...</p>
        </div>)}
        <div className="mt-auto space-y-2">
          {players.map(p=>(<div key={p.id} className="flex items-center gap-2 bg-stone-900 rounded-xl px-3 py-2">
            <PlayerAvatar player={p} size="sm"/>
            <span className="text-white text-sm flex-1">{p.name}</span>
            <span className={`text-sm ${picks[p.id]?'text-green-400':'text-stone-600'}`}>{picks[p.id]?'✓':'...'}</span>
          </div>))}
        </div>
      </>)}
      {phase==='result'&&(<div className="flex-1 flex flex-col">
        <div className="space-y-3 mb-4">
          {players.map(p=>{const isW=winChoice&&picks[p.id]===winChoice;const isDraw=!winChoice;
            return(<div key={p.id} className={`flex items-center gap-3 rounded-2xl p-4 border-2 ${isDraw?'bg-stone-800 border-stone-600':isW?'bg-amber-900 border-amber-400':'bg-red-950 border-red-800'}`}>
              <PlayerAvatar player={p} size="md"/>
              <div className="flex-1"><div className="text-white font-bold">{p.name}</div><div className="text-stone-300 text-sm">{picks[p.id]?NM[picks[p.id]]:'—'}</div></div>
              <div className="text-4xl">{picks[p.id]?SYM[picks[p.id]]:'?'}</div>
              {isW&&<span className="text-lg">🏆</span>}{!isDraw&&!isW&&<span className="text-lg">🍺</span>}
            </div>);
          })}
        </div>
        {!winChoice&&<div className="text-center text-white font-black text-xl mb-4">🤝 Ничья!</div>}
        {isHost&&(<div className="flex gap-3 mt-auto">
          <button onClick={()=>updateState({phase:'picking',picks:{},round:round+1})} className="flex-1 py-3 bg-amber-500 text-stone-900 rounded-xl font-bold active:scale-95">Ещё раунд</button>
          <button onClick={endGame} className="py-3 px-4 bg-stone-800 text-stone-400 rounded-xl font-bold active:scale-95">Лобби</button>
        </div>)}
      </div>)}
    </div>
  );
}

/* —— РОУТЕР ОНЛАЙН-ИГР —— */
function OnlineGameRouter({code,playerId,isHost,onBack,onLeaveRoom}){
  const[room,setRoom]=useState(null);
  useEffect(()=>{
    const db=firebase.database();
    const ref=db.ref('rooms/'+code);
    ref.on('value',snap=>{
      const val=snap.val();
      if(!val||!val.game){onBack();return;}
      setRoom(val);
    });
    return()=>ref.off();
  },[]);
  if(!room)return<div className="min-h-screen bg-stone-950 flex items-center justify-center"><div className="text-white animate-pulse">Загрузка...</div></div>;
  const db=firebase.database();
  const players=Object.entries(room.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>a.joinedAt-b.joinedAt);
  const gameState=room.gameState||{};
  function updateState(u){db.ref('rooms/'+code+'/gameState').update(u);}
  function endGame(){db.ref('rooms/'+code+'/game').set(null);db.ref('rooms/'+code+'/gameState').set(null);}
  function leaveRoom(){db.ref('rooms/'+code+'/players/'+playerId).remove();onLeaveRoom();}
  const props={gameState,players,playerId,isHost,code,updateState,endGame,onLeave:leaveRoom};
  const g=room.game;
  if(g==='roulette')return<OnlineRouletteGame {...props}/>;
  if(g==='bomba')return<OnlineBombaGame {...props}/>;
  if(g==='names')return<OnlineNamesGame {...props}/>;
  if(g==='ktoiznas')return<OnlineKtoIzNasGame {...props}/>;
  if(g==='svetofor')return<OnlineSvetoforGame {...props}/>;
  if(g==='knb')return<OnlineKNBGame {...props}/>;
  return null;
}

/* ═══════════════ APP ═══════════════ */
function App(){
  const[mode,setMode]=useState(()=>{
    const rp=new URLSearchParams(window.location.search).get('room');
    return(rp&&rp.length===4)?'online':null;
  });
  const[room,setRoom]=useState(null);
  const[game,setGame]=useState(null);

  if(!mode)return<ModeLanding onOffline={()=>setMode('offline')} onOnline={()=>setMode('online')}/>;

  if(mode==='online'){
    if(!room)return<OnlineSetup onBack={()=>setMode(null)} onDone={setRoom}/>;
    if(!game)return<LobbyScreen {...room} onBack={()=>setRoom(null)} onStart={g=>setGame(g)}/>;
    return<OnlineGameRouter {...room} onBack={()=>setGame(null)} onLeaveRoom={()=>{setRoom(null);setGame(null);}}/>;
  }

  const back=()=>setGame(null);
  if(!game)return<HomeScreen onSelect={setGame} onModeBack={()=>setMode(null)}/>;
  if(game==='roulette')return<RouletteGame onBack={back}/>;
  if(game==='bomba')return<BombaGame onBack={back}/>;
  if(game==='names')return<NamesGame onBack={back}/>;
  if(game==='ktoiznas')return<KtoIzNasGame onBack={back}/>;
  if(game==='svetofor')return<SvetoforGame onBack={back}/>;
  if(game==='knb')return<KNBGame onBack={back}/>;
  if(game==='bill')return<BillGame onBack={back}/>;
  return<HomeScreen onSelect={setGame} onModeBack={()=>setMode(null)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
